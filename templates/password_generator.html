{% extends "base.html" %}
{% block title %}CyberShield - Password Generator{% endblock %}
{% block content %}
<h1 class="fw-bold mb-4"><i class="bi bi-shuffle text-primary"></i> Password Generator</h1>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Length: <span id="lenLabel">{{ settings.length }}</span></label>
                <input type="range" class="form-range" name="length" min="8" max="64"
                       value="{{ settings.length }}" oninput="document.getElementById('lenLabel').textContent = this.value">
            </div>
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="use_upper" id="useUpper"
                       {% if settings.use_upper %}checked{% endif %}>
                <label class="form-check-label" for="useUpper">Include uppercase letters</label>
            </div>
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="use_numbers" id="useNumbers"
                       {% if settings.use_numbers %}checked{% endif %}>
                <label class="form-check-label" for="useNumbers">Include numbers</label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" name="use_symbols" id="useSymbols"
                       {% if settings.use_symbols %}checked{% endif %}>
                <label class="form-check-label" for="useSymbols">Include symbols</label>
            </div>
            <button type="submit" class="btn btn-primary">Generate Password</button>
        </form>

        {% if generated %}
        <hr>
        <label class="form-label">Generated password</label>
        <div class="input-group">
            <input type="text" class="form-control font-monospace" id="genPw" value="{{ generated }}" readonly>
            <button class="btn btn-outline-secondary" type="button" onclick="copyPw()">
                <i class="bi bi-clipboard"></i> Copy
            </button>
        </div>
        <small id="copyMsg" class="text-success"></small>
        {% endif %}
    </div>
</div>

<script>
function copyPw() {
    const input = document.getElementById('genPw');
    navigator.clipboard.writeText(input.value).then(() => {
        document.getElementById('copyMsg').textContent = 'Copied to clipboard!';
        setTimeout(() => document.getElementById('copyMsg').textContent = '', 2000);
    });
}
</script>
{% endblock %}
