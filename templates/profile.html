{% extends "base.html" %}
{% block title %}CyberShield - Profile{% endblock %}
{% block content %}
<h1 class="fw-bold mb-4"><i class="bi bi-person-circle text-primary"></i> Profile</h1>

<div class="row g-4">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h6 class="text-muted">Account Info</h6>
                <p class="mb-1"><strong>Username:</strong> {{ user.username }}</p>
                <p class="mb-1"><strong>Email:</strong> {{ user.email }}</p>
                <p class="mb-0"><strong>Joined:</strong> {{ user.created_at }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h6 class="text-muted mb-3">Change Password</h6>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        <input type="password" class="form-control" name="old_password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-control" name="new_password" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
